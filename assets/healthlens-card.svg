<svg xmlns="http://www.w3.org/2000/svg" width="820" height="116" viewBox="0 0 820 116">
  <!-- Background -->
  <rect width="820" height="116" fill="#13171F"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="116" fill="#2DD4BF"/>

  <!-- Dot indicator -->
  <circle cx="28" cy="32" r="4" fill="#2DD4BF"/>

  <!-- Project name -->
  <text x="44" y="38"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="18" font-weight="700" fill="#E2E8F0">HealthLens</text>

  <!-- Description line 1 -->
  <text x="44" y="60"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="13" fill="#8892A4">End-to-end public health analytics on Brazil's DataSUS — mortality, hospitalization,</text>

  <!-- Description line 2 -->
  <text x="44" y="76"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="13" fill="#8892A4">epidemiological surveillance, forecasting, and municipality clustering.</text>

  <!-- Stack chips -->
  <rect x="44"  y="89" width="56"  height="20" rx="4" fill="#0B0E14" stroke="#1E2530" stroke-width="1"/>
  <text x="72"  y="103" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#8892A4">Python</text>

  <rect x="106" y="89" width="84"  height="20" rx="4" fill="#0B0E14" stroke="#1E2530" stroke-width="1"/>
  <text x="148" y="103" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#8892A4">PostgreSQL</text>

  <rect x="196" y="89" width="64"  height="20" rx="4" fill="#0B0E14" stroke="#1E2530" stroke-width="1"/>
  <text x="228" y="103" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#8892A4">FastAPI</text>

  <rect x="266" y="89" width="58"  height="20" rx="4" fill="#0B0E14" stroke="#1E2530" stroke-width="1"/>
  <text x="295" y="103" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#8892A4">Docker</text>

  <rect x="330" y="89" width="64"  height="20" rx="4" fill="#0B0E14" stroke="#1E2530" stroke-width="1"/>
  <text x="362" y="103" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#8892A4">Alembic</text>

  <rect x="400" y="89" width="76"  height="20" rx="4" fill="#0B0E14" stroke="#1E2530" stroke-width="1"/>
  <text x="438" y="103" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#8892A4">React / TS</text>

  <!-- CI badge (top-right) -->
  <rect x="696" y="20" width="100" height="24" rx="4" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>
  <text x="746" y="36" text-anchor="middle"
    font-family="'SFMono-Regular',Consolas,monospace"
    font-size="12" fill="#34D399">&#x2713; CI passing</text>
</svg>
